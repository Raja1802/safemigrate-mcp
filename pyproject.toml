[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safemigrate-mcp"
version = "0.1.0"
description = "Production-ready Model Context Protocol (MCP) server for SQL migration risk analysis and zero-downtime rewrites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "fastmcp>=0.4.0",
    "sqlglot>=25.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
safemigrate = "src.server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
