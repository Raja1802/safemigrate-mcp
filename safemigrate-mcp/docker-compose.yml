version: '3.8'

services:
  safemigrate-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: safemigrate-mcp:latest
    container_name: safemigrate-mcp
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - TRANSPORT=sse
      - AUTH_TOKENS=test-token-123
      - RATE_LIMIT_ENABLED=false
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
